name: a1111_mini
description: "A1111 Mini — Stable Diffusion Mobile Suite"
publish_to: 'none'
version: 1.0.10+12

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  # iOS 26 simulator workaround: avoids objective_c native asset loading path issue
  path_provider_foundation: 2.4.2
  path: ^1.9.1

  # Networking
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_analytics: ^11.5.1
  cloud_firestore: ^5.6.5

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # Image handling
  image_gallery_saver_plus: ^4.0.1
  image_picker: ^1.1.2
  image: ^4.2.0

  # UI
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  glassmorphism_ui: ^0.3.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  share_plus: ^10.1.4
  mobile_scanner: ^6.0.2
  timeago: ^3.7.0
  device_info_plus: ^11.3.0
  package_info_plus: ^8.0.0
  pro_image_editor: ^12.4.4
  shared_preferences: ^2.5.5
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1A1A2E"
  image: "assets/splash/splash_logo.png"
  ios: true
  android: false
  color_dark: "#0F0F1A"
  image_dark: "assets/splash/splash_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
